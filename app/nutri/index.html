<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Nutri · tu comida de la semana</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f2f3f5">
    <meta name="description" content="Proteína del día, menú mexicano barato, lista del súper y tu peso.">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Un service worker viejo (cache 'nutri-v1') guardaba la pagina del antibot de InfinityFree y
          // su cookie vencida bloqueaba la API; no se puede actualizar solo (el antibot tambien
          // contesta sw.js con HTML). Se quita una vez y se recarga.
          if (window.caches) {
            caches.keys().then(function (k) {
              if (k.indexOf('nutri-v1') < 0) return;
              navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
                .then(function () { return caches.delete('nutri-v1'); })
                .then(function () { location.reload(); });
            });
          }
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <app-nutri></app-nutri>
  </body>
</html>
