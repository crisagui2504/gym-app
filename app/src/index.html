<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>GymTracker</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141414">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Encode+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script>
      try {
        if ((localStorage.getItem('tema') || 'dark') === 'dark') {
          document.documentElement.classList.add('theme-dark');
        }
      } catch (e) {}
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          // Un service worker viejo (cache 'gymtracker-v5') guardaba la pagina del antibot de InfinityFree y
          // su cookie vencida bloqueaba la API; no se puede actualizar solo (el antibot tambien
          // contesta sw.js con HTML). Se quita una vez y se recarga.
          if (window.caches) {
            caches.keys().then(function (k) {
              if (k.indexOf('gymtracker-v5') < 0) return;
              navigator.serviceWorker.getRegistrations()
                .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })
                .then(function () { return caches.delete('gymtracker-v5'); })
                .then(function () { location.reload(); });
            });
          }
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
